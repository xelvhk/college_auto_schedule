[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "college-timetable"
version = "0.2.1a1"
description = "Локальная система подготовки и составления расписания колледжа"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx2>=2.3,<3"]

[project.scripts]
rasp = "rasp.cli:main"
rasp-desktop = "rasp.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rasp.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
