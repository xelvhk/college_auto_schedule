name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONWARNINGS: error
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check installed dependency consistency
        run: python -m pip check

  package:
    name: Build wheel
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify packaged web assets
        run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          wheel = next(Path('dist').glob('*.whl'));
          names = set(ZipFile(wheel).namelist());
          required = {'rasp/web/static/index.html', 'rasp/web/static/styles.css',
          'rasp/web/static/app.js', 'rasp/web/static/favicon.svg'};
          missing = sorted(required - names);
          assert not missing, f'Missing packaged assets: {missing}'"
