name: Medium solver benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: solver-medium-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: 20,000 lessons / Windows x64
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONWARNINGS: error
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install .

      - name: Run medium-college benchmark
        run: >-
          python scripts/run_medium_solver_benchmark.py
          --output artifacts/benchmarks/solver-medium.json
          --time-limit 300

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: solver-medium-benchmark-windows
          path: artifacts/benchmarks/solver-medium.json
          if-no-files-found: error
          retention-days: 30
