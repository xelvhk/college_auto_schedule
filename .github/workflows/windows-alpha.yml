name: Windows functional alpha

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-alpha.yml"
      - "packaging/windows/**"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and smoke-test installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller==6.21.0"

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean packaging/windows/college_auto_schedule.spec

      - name: Build per-user installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc packaging/windows/installer.iss

      - name: Install and smoke-test functional alpha
        shell: pwsh
        run: |
          $installer = Resolve-Path (Get-ChildItem dist/installer/*.exe | Select-Object -First 1)
          $installDirectory = Join-Path $env:RUNNER_TEMP "CollegeAutoSchedule-installed"
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDirectory" -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)."
          }
          packaging/windows/smoke_test.ps1 -Executable "$installDirectory\CollegeAutoSchedule.exe"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $checksumLines = Get-FileHash dist/installer/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" }
          $checksumText = ($checksumLines -join "`n") + "`n"
          [IO.File]::WriteAllText(
            "dist/installer/SHA256SUMS.txt",
            $checksumText,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload functional alpha installer
        uses: actions/upload-artifact@v4
        with:
          name: CollegeAutoSchedule-Windows-alpha
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
